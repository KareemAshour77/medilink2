name: medilink
description: MediLink - Your Link to Doctors
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.1
  google_fonts: ^8.1.0
  smooth_page_indicator: ^2.0.1
  pin_code_fields: ^9.4.0
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_gen: ^5.13.0+1
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  open_filex: ^4.3.4
  flutter_native_splash: ^2.4.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_multipart: ^2.0.1
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  mime: ^2.0.0
  image: ^4.1.7 
  jwt_decoder: ^2.0.1
  http_parser: ^4.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # ── Location ──────────────────────────────────────────────
  geolocator: ^13.0.0

  # ── Real-time chat ────────────────────────────────────────
  socket_io_client: ^3.0.0

  # ── Google Sign-In (no Firebase needed) ──────────────────
  google_sign_in: ^7.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  lints: ^6.1.0
  test: ^1.24.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"
  android_12:
    color: "#FFFFFF"
