org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation. The pub cache (C:) and project (D:)
# are on different drives, which breaks Kotlin's incremental cache on Windows
# ("this and base files have different roots"). Plugins like google_maps_flutter
# compile from the C: pub cache, so a full (non-incremental) compile is required.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
